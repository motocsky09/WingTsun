<div class="trainer-page-container">
  <header class="trainer-header">
    <img [src]="profileImage" alt="Profile Image of Si-Fu Costan Gabriel-Alex" class="profile-image">
    <h1>Si-Fu Costan Gabriel-Alex</h1>
    <p class="tagline">Instructor de Wing Tsun Kung-Fu</p>
  </header>

  <ng-container *ngFor="let section of sections; let i = index">
    <section class="trainer-section">
      <div class="description-section">
        <h2 class="section-title">{{ section.title }}</h2>
        <div class="section-content">
          <p *ngFor="let paragraph of section.content">{{ paragraph }}</p>
        </div>
      </div>
    </section>

    <section class="media-showcase" *ngIf="mediaFiles.slice(i * 5, (i + 1) * 5).length > 0">
      <div class="media-grid">
        <ng-container *ngFor="let media of mediaFiles.slice(i * 5, (i + 1) * 5)">
          <img *ngIf="media.type === 'image'" [src]="media.src" alt="Wing Tsun Training" class="media-item">
          <video *ngIf="media.type === 'video'" [src]="media.src" controls class="media-item"></video>
        </ng-container>
      </div>
    </section>
  </ng-container>

  <section class="media-showcase" *ngIf="mediaFiles.length > sections.length * 5">
    <div class="media-grid">
      <ng-container *ngFor="let media of mediaFiles.slice(sections.length * 5)">
        <img *ngIf="media.type === 'image'" [src]="media.src" alt="Wing Tsun Training" class="media-item">
        <video *ngIf="media.type === 'video'" [src]="media.src" controls class="media-item"></video>
      </ng-container>
    </div>
  </section>
</div>
