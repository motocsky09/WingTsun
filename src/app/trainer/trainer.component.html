<div class="trainer-page-container">

  <section class="trainer-hero">
    <div class="hero-content">
      <div class="profile-wrapper">
        <div class="profile-ring"></div>
        <img [src]="profileImage" alt="Si-Fu Costan Gabriel-Alex" class="profile-image">
      </div>
      <div class="hero-text">
        <span class="hero-badge">Wing Tsun Kung-Fu</span>
        <h1>Si-Fu Costan Gabriel-Alex</h1>
        <p class="tagline">Instructor de Wing Tsun Kung-Fu</p>
        <div class="hero-divider"></div>
      </div>
    </div>
  </section>

  <div class="sections-container">
    <article class="trainer-card" *ngFor="let section of sections; let i = index">
      <div class="card-number">{{ padNumber(i + 1) }}</div>
      <div class="card-body">
        <h2 class="section-title">{{ section.title }}</h2>
        <div class="section-divider"></div>
        <div class="section-content">
          <p *ngFor="let paragraph of section.content">{{ paragraph }}</p>
        </div>
      </div>
    </article>
  </div>

  <section class="gallery-section">
    <div class="gallery-header reveal">
      <span class="gallery-label">Galerie Foto</span>
      <h2 class="gallery-title">Momente din Activitate</h2>
    </div>

    <div class="bento-grid">
      <div class="bento-item bento-featured reveal" (click)="openLightbox(0)">
        <img [src]="images[0]" alt="Wing Tsun Training" loading="lazy">
        <div class="bento-caption"><span>Wing Tsun</span></div>
      </div>
      <div
        class="bento-item reveal"
        *ngFor="let img of images.slice(1); let i = index"
        (click)="openLightbox(i + 1)"
      >
        <img [src]="img" alt="Wing Tsun Training" loading="lazy">
        <div class="bento-caption"><span>Wing Tsun</span></div>
      </div>
    </div>
  </section>

  <section class="video-section">
    <div class="gallery-header reveal">
      <span class="gallery-label">Antrenamente</span>
      <h2 class="gallery-title">Video</h2>
    </div>

    <div class="video-grid">
      <div class="video-card reveal" *ngFor="let video of videos">
        <video [src]="video" controls preload="metadata"></video>
      </div>
    </div>
  </section>

  <div class="lightbox" [class.open]="lightboxOpen" (click)="closeLightbox()">
    <div class="lightbox-content" (click)="$event.stopPropagation()">
      <button class="lb-close" (click)="closeLightbox()" aria-label="Închide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <button class="lb-nav lb-prev" (click)="prevImage()" aria-label="Anterior">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="lb-image-wrap">
        <img [src]="images[lightboxIndex]" alt="Wing Tsun" class="lb-image">
      </div>
      <button class="lb-nav lb-next" (click)="nextImage()" aria-label="Următor">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
      <div class="lb-counter">{{ lightboxIndex + 1 }} / {{ images.length }}</div>
    </div>
  </div>

</div>
